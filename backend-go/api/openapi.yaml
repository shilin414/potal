openapi: 3.0.3
info:
  title: Creation Agent Studio API
  version: 2.0.0
  description: |
    Creation Agent Studio backend contract (Go control plane).

    This file is the single source of truth for the HTTP API.
    Go server types and TypeScript clients are generated from it.

    ## Error envelope conventions (legacy-compatible)

    The React frontend was validated against the Django reference
    implementation, which produced four distinct error shapes:

    - `{"detail": "message"}` — 403/404 style errors (DRF PermissionDenied / NotFound).
    - `{"error": "message"}` — simple JSON errors (identity endpoints, 409/502 conflicts).
    - `{"field": ["message", ...]}` — field validation errors (DRF serializer style).
    - `["message"]` — bare array, 400 for hand-raised DRF ValidationErrors (e.g. "application_id is required").

    All four shapes are reproduced exactly. Clients should read the
    `detail` / `error` / first field message in that order.

    ## Authentication

    Normal users authenticate with the HttpOnly opaque session cookie
    `studio_session` (set by OAuth exchange / admin login). All
    state-changing requests additionally require the CSRF header
    `X-CSRF-Token` matching the `studio_csrf` cookie (double-submit).
    `GET /api/v2/artifacts/{id}/open` is cookie-authenticated because it is
    opened via browser navigation (window.open) and cannot send headers.

    ## SSE

    `GET /api/v2/runs/{id}/stream` responds with `text/event-stream`.
    Frames: `event: run.event` + `data: {run_id, sequence, event_type, payload[, created_at]}`,
    keepalive comment lines `: keepalive` every 15s of silence.
    Durable replay resumes STRICTLY AFTER the client cursor: precedence is
    query `after` > `Last-Event-ID` header > 0. Transient live frames
    (`content.delta` et al.) carry sequence 0 and deliberately write NO
    `id:` — they never advance the cursor and are never replayed.
    Live frames end after the first terminal event
    (`run.completed` / `run.failed` / `run.cancelled`), then the connection
    closes. `run.interrupted` is legacy historical compatibility only
    (pre-closure replays); the live protocol never emits it.
servers:
  - url: /
tags:
  - name: identity
  - name: auth
  - name: applications
  - name: runtimes
  - name: runs
  - name: artifacts

paths:
  # ─────────────────────────────────────────────────────────── identity ──
  /api/identity/oauth/start:
    get:
      operationId: oauthStart
      tags: [identity]
      summary: Redirect (302) the browser to the Feishu OAuth authorize page
      parameters:
        - name: return_to
          in: query
          schema: { type: string, default: "/" }
          description: SPA path to return to after login; must start with "/" and not "//".
      responses:
        "302":
          description: Redirect to Feishu authorize URL (state signed, 10 min TTL).
          headers:
            Location:
              schema: { type: string }
        "500":
          description: OAuth not configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimpleError" }

  /api/identity/oauth/exchange:
    get:
      operationId: oauthExchange
      tags: [identity]
      summary: Exchange the OAuth ?code&state for a studio session
      description: |
        Verifies the signed state, exchanges the code at the Feishu token
        endpoint, upserts the local user (auth_source=feishu), stores the
        refresh token AES-256-GCM encrypted, sets the `studio_session`
        HttpOnly cookie and returns the session user plus JWT tokens for the
        legacy transition window.
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Authenticated
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [user, tokens, return_to]
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  tokens: { $ref: "#/components/schemas/Tokens" }
                  return_to: { type: string }
        "400":
          description: missing code / invalid or expired oauth state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimpleError" }
        "502":
          description: oauth exchange failed / no access token / user info failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimpleError" }

  /api/identity/session:
    get:
      operationId: getSession
      tags: [identity]
      summary: Current session user (cookie-authenticated)
      responses:
        "200":
          description: Session user payload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionUser" }
        "401":
          description: not authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimpleError" }

  /api/identity/admin/login:
    post:
      operationId: adminLogin
      tags: [identity]
      summary: Local admin login (Argon2id password)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        "200":
          description: Admin session established
          content:
            application/json:
              schema:
                type: object
                required: [id, username, is_staff, auth_source]
                properties:
                  id: { type: integer }
                  username: { type: string }
                  is_staff: { type: boolean }
                  auth_source: { type: string }
                  display_name: { type: string }
                  display_id: { type: string }
        "401":
          description: invalid credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimpleError" }

  # ─────────────────────────────────────────────────────────────── auth ──
  /api/auth/login/:
    post:
      operationId: authLogin
      tags: [auth]
      summary: Local username/password login (transition window)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        "200":
          description: Logged in; also sets studio_session cookie
          content:
            application/json:
              schema:
                type: object
                required: [user, tokens]
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  tokens: { $ref: "#/components/schemas/Tokens" }
        "401":
          description: bad credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DetailError" }

  /api/auth/logout/:
    post:
      operationId: authLogout
      tags: [auth]
      summary: Logout; clears the studio_session cookie
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail: { type: string }

  /api/auth/token/refresh/:
    post:
      operationId: tokenRefresh
      tags: [auth]
      summary: Rotate a JWT refresh token (transition window)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh]
              properties:
                refresh: { type: string }
      responses:
        "200":
          description: New access token
          content:
            application/json:
              schema:
                type: object
                properties:
                  access: { type: string }
                  refresh: { type: string }

  /api/auth/me/:
    get:
      operationId: getMe
      tags: [auth]
      summary: Current user profile
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
    patch:
      operationId: patchMe
      tags: [auth]
      summary: Update current user profile
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string }
                email: { type: string }
                avatar: { type: string }
                bio: { type: string }
                display_id: { type: string }
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }

  # ─────────────────────────────────────────────────────── applications ──
  /api/v2/applications:
    get:
      operationId: listApplications
      tags: [applications]
      summary: List openable applications (bare array, no pagination envelope)
      parameters:
        - name: kind
          in: query
          schema: { type: string, enum: [chat, task, custom, all], default: chat }
          description: Invalid values fall back to chat.
        - name: scope
          in: query
          schema: { type: string, enum: [public, mine, manage], default: public }
          description: Invalid values fall back to public.
        - name: include_unbound
          in: query
          schema: { type: string }
          description: Truthy when case-insensitively in {1,true,yes}.
      responses:
        "200":
          description: Application list items (bare array)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ApplicationListItem" }
    post:
      operationId: createApplication
      tags: [applications]
      summary: Create an application (admin only — agent marketplace "new Aily agent")
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplicationCreateRequest" }
      responses:
        "201":
          description: Created (compact detail shape)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationDetail" }
        "400":
          description: field errors
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FieldErrors" }
        "403":
          description: only admins may add agents
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DetailError" }

  /api/v2/applications/{id}:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
    get:
      operationId: getApplication
      tags: [applications]
      summary: Application detail (compact shape)
      responses:
        "200":
          description: Detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationDetail" }
        "404":
          description: application not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DetailError" }
    patch:
      operationId: updateApplication
      tags: [applications]
      summary: Update an application / rebind runtime (creator or staff)
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplicationUpdateRequest" }
      responses:
        "200":
          description: Updated (compact shape)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationDetail" }
        "403":
          description: only creator or staff
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DetailError" }
        "404":
          description: application not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DetailError" }
    delete:
      operationId: deleteApplication
      tags: [applications]
      summary: Delete an application (409 when referenced by conversations/runs)
      responses:
        "204":
          description: Deleted
        "403":
          description: only creator or staff
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DetailError" }
        "409":
          description: has conversations or runs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DetailError" }

  /api/v2/applications/{id}/favorite:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
    post:
      operationId: favoriteApplication
      tags: [applications]
      summary: Pin application (idempotent)
      responses:
        "200":
          description: Favorite state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FavoriteResult" }
        "404":
          description: application not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DetailError" }
    delete:
      operationId: unfavoriteApplication
      tags: [applications]
      summary: Unpin application (idempotent)
      responses:
        "200":
          description: Favorite state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FavoriteResult" }
        "404":
          description: application not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DetailError" }

  /api/v2/applications/{id}/avatar:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
    get:
      operationId: getApplicationAvatar
      tags: [applications]
      summary: Stream avatar image bytes
      responses:
        "200":
          description: Image bytes
          content:
            image/png: {}
            image/jpeg: {}
            image/gif: {}
            image/webp: {}
        "404":
          description: avatar not set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DetailError" }
    post:
      operationId: uploadApplicationAvatar
      tags: [applications]
      summary: Replace avatar (multipart file; png/jpg/jpeg/gif/webp ≤ 2MB)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Updated (compact shape)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationDetail" }
        "400":
          description: field errors
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FieldErrors" }
    delete:
      operationId: clearApplicationAvatar
      tags: [applications]
      summary: Clear avatar (falls back to emoji icon)
      responses:
        "200":
          description: Updated (compact shape)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationDetail" }

  /api/v2/applications/{id}/default-agent:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
    post:
      operationId: setDefaultAgent
      tags: [applications]
      summary: Set as workspace main agent (chat + enabled binding only)
      responses:
        "200":
          description: Updated (compact shape)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationDetail" }
        "400":
          description: not eligible
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DetailError" }
        "403":
          description: only creator or staff
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DetailError" }
    delete:
      operationId: unsetDefaultAgent
      tags: [applications]
      summary: Unset workspace main agent
      responses:
        "200":
          description: Updated (compact shape)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationDetail" }

  /api/v2/applications/{id}/attachments:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
    post:
      operationId: uploadApplicationAttachment
      tags: [applications]
      summary: Pre-run attachment upload (stored in studio storage; the worker uploads to the provider with the user's UAT)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                type:
                  type: string
                  enum: [image, file, feishu_doc, bitable]
                  default: file
                doc_url:
                  type: string
      responses:
        "201":
          description: Attachment created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuntimeAttachment" }
        "400":
          description: file or doc_url required / binding missing
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/DetailError" }
                  - { $ref: "#/components/schemas/BareError" }
                  - { $ref: "#/components/schemas/FieldErrors" }
        "502":
          description: attachment upload failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimpleError" }

  # ───────────────────────────────────────────────────────── schedules ──
  /api/v2/schedules:
    get:
      operationId: listSchedules
      tags: [schedules]
      summary: List the caller's schedules (keyset pagination)
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [all, running, paused, failed], default: all }
        - name: before_id
          in: query
          schema: { type: integer }
          description: Keyset cursor — return schedules with id < before_id.
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 100 }
      responses:
        "200":
          description: Schedule page (bare array; empty means no more)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Schedule" }
        "401":
          description: not authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DetailError" }
    post:
      operationId: createSchedule
      tags: [schedules]
      summary: Create a schedule (owner = caller; enabled by default)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleUpsertRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "400":
          description: field errors
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FieldErrors" }
        "401":
          description: not authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DetailError" }

  /api/v2/schedules/preview:
    post:
      operationId: previewScheduleRuns
      tags: [schedules]
      summary: Compute the next trigger times for a candidate trigger (no side effects)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleUpsertRequest" }
      responses:
        "200":
          description: Next trigger times (UTC ISO-8601), at most 3
          content:
            application/json:
              schema:
                type: object
                properties:
                  next_runs:
                    type: array
                    items: { type: string, format: date-time }
        "400":
          description: invalid trigger
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FieldErrors" }

  /api/v2/schedules/{id}:
    parameters:
      - $ref: "#/components/parameters/ScheduleId"
    get:
      operationId: getSchedule
      tags: [schedules]
      summary: Schedule detail
      responses:
        "200":
          description: Schedule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "404":
          description: unknown or foreign schedule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DetailError" }
    patch:
      operationId: updateSchedule
      tags: [schedules]
      summary: Update a schedule (next_run_at recomputed from now)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleUpsertRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "400":
          description: field errors
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FieldErrors" }
        "404":
          description: unknown or foreign schedule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DetailError" }
    delete:
      operationId: deleteSchedule
      tags: [schedules]
      summary: Delete a schedule (occurrence/run/delivery history is kept)
      responses:
        "204":
          description: Deleted
        "404":
          description: unknown or foreign schedule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DetailError" }

  /api/v2/schedules/{id}/enable:
    parameters:
      - $ref: "#/components/parameters/ScheduleId"
    post:
      operationId: enableSchedule
      tags: [schedules]
      summary: Enable a schedule (next_run_at recomputed from now; missed slots are not replayed)
      responses:
        "200":
          description: Updated schedule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "404":
          description: unknown or foreign schedule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DetailError" }

  /api/v2/schedules/{id}/disable:
    parameters:
      - $ref: "#/components/parameters/ScheduleId"
    post:
      operationId: disableSchedule
      tags: [schedules]
      summary: Disable a schedule (no new occurrences; already queued runs are kept)
      responses:
        "200":
          description: Updated schedule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "404":
          description: unknown or foreign schedule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DetailError" }

  /api/v2/schedules/{id}/run-now:
    parameters:
      - $ref: "#/components/parameters/ScheduleId"
    post:
      operationId: runScheduleNow
      tags: [schedules]
      summary: Trigger one real occurrence now (overlap policy applies; next_run_at untouched)
      responses:
        "202":
          description: Occurrence created and run queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScheduleOccurrence" }
        "404":
          description: unknown or foreign schedule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DetailError" }
        "409":
          description: overlap policy skip and a previous run is still active
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DetailError" }

  /api/v2/schedules/{id}/occurrences:
    parameters:
      - $ref: "#/components/parameters/ScheduleId"
    get:
      operationId: listScheduleOccurrences
      tags: [schedules]
      summary: Execution history (keyset pagination, newest first)
      parameters:
        - name: before_id
          in: query
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 100 }
      responses:
        "200":
          description: Occurrence page (bare array)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ScheduleOccurrence" }
        "404":
          description: unknown or foreign schedule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DetailError" }

  # ─────────────────────────────────────────────────────────── runtimes ──
  /api/v2/runtimes:
    get:
      operationId: listRuntimes
      tags: [runtimes]
      summary: Runtime catalog (active providers × registered adapters)
      responses:
        "200":
          description: Runtime descriptors (bare array)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RuntimeDescriptor" }

  /api/v2/runtimes/validate:
    post:
      operationId: validateRuntime
      tags: [runtimes]
      summary: Validate resource id format + remote visibility (best-effort)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider_key, runtime_type]
              properties:
                provider_key: { type: string }
                runtime_type: { type: string, default: agent }
                external_resource_id: { type: string }
                identity_mode: { type: string, default: user }
      responses:
        "200":
          description: Validation outcome (checked=false means skipped, not failed)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuntimeValidationResult" }
        "400":
          description: field errors
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FieldErrors" }

  # ─────────────────────────────────────────────────────────────── runs ──
  /api/v2/runs:
    post:
      operationId: createRun
      tags: [runs]
      summary: Create a run (lazily creates the conversation when conversation_id is absent)
      description: |
        With a `client_request_id` the request is IDEMPOTENT: an identical
        resend returns the ORIGINAL run with HTTP 200 and
        `idempotency_replayed=true` instead of creating a second run, user
        message and provider chat. Reusing the id with a different payload is
        rejected with HTTP 409 `idempotency_key_reused`.

        The identity is reserved inside the run-creation transaction and is
        checked before authorization, rate limiting and attachment
        validation, so a resend is never misreported as a limit violation for
        a request that already succeeded.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRunRequest" }
      responses:
        "200":
          description: Idempotent replay — the original run for this client_request_id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "201":
          description: Run created (status=queued)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "400":
          description: validation errors (bare array style)
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/BareError" }
                  - { $ref: "#/components/schemas/FieldErrors" }
        "409":
          description: idempotency_key_reused — the client_request_id is bound to another payload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DetailError" }

  /api/v2/runs/{runId}:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      operationId: getRun
      tags: [runs]
      summary: Run detail (owner or staff only; unknown ids return 404)
      responses:
        "200":
          description: Run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "404":
          description: run not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DetailError" }

  /api/v2/runs/{runId}/events:
    parameters:
      - $ref: "#/components/parameters/RunId"
      - name: after
        in: query
        schema: { type: integer, minimum: 0, default: 0 }
        description: Return events with sequence > after (ascending). Keyset cursor.
      - name: limit
        in: query
        schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
        description: Page size (default 200, maximum 1000).
    get:
      operationId: listRunEvents
      tags: [runs]
      summary: One keyset page of persisted run events (replay after reconnect)
      description: |
        Keyset pagination over (run_id, sequence) — no OFFSET, so page N costs
        the same as page 1. Walk by feeding `next_after` back into `after`
        while `has_more` is true.
      responses:
        "200":
          description: Event page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunEventPage" }
        "404":
          description: run not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DetailError" }

  /api/v2/runs/{runId}/stream:
    parameters:
      - $ref: "#/components/parameters/RunId"
      - name: after
        in: query
        schema: { type: integer, minimum: 0, default: 0 }
        description: >-
          Durable cursor: replay only events with sequence > after. Takes
          precedence over the Last-Event-ID header.
    get:
      operationId: streamRun
      tags: [runs]
      summary: SSE stream (paged DB replay from the durable cursor, then Redis live frames)
      description: |
        `text/event-stream`. Durable frames:

        `event: run.event\nid: <sequence>\ndata: {"run_id","sequence","event_type","payload"}\n\n`

        The `id:` line carries the durable run sequence, so a reconnecting
        client can resume from the last event it processed: either by sending
        `?after=<sequence>` or by letting EventSource replay `Last-Event-ID`.
        Precedence is query `after` > `Last-Event-ID` > 0.

        TRANSIENT frames (content.delta, fanned out live without being
        persisted) carry sequence 0 and deliberately write NO `id:` — sequence
        0 is a sentinel, and writing it would reset the browser's cursor to
        the beginning of the run.

        Keepalive comment `: keepalive` after 15s of silence.
        Closes after replay when the run is already terminal, or after the
        first terminal live event.
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
        "404":
          description: run not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DetailError" }

  /api/v2/runs/{runId}/commands:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      operationId: createRunCommand
      tags: [runs]
      summary: Issue a run command (cancel / respond / resume)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRunCommandRequest" }
      responses:
        "201":
          description: Command recorded (status=pending)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunCommand" }
        "400":
          description: field errors
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FieldErrors" }
        "404":
          description: run not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DetailError" }
        "409":
          description: provider does not support cancel
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimpleError" }

  /api/v2/runs/{runId}/attachments:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      operationId: uploadRunAttachment
      tags: [runs]
      summary: Attach a file to a queued run
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                type:
                  type: string
                  enum: [image, file, feishu_doc, bitable]
                  default: file
                doc_url:
                  type: string
      responses:
        "201":
          description: Attachment bound to the run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuntimeAttachment" }
        "404":
          description: run not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DetailError" }
        "409":
          description: run no longer queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimpleError" }
        "502":
          description: attachment upload failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimpleError" }

  /api/v2/runs/{runId}/artifacts:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      operationId: listRunArtifacts
      tags: [runs]
      summary: Artifacts of a run (created_at ascending)
      responses:
        "200":
          description: Artifacts (bare array)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RunArtifact" }
        "404":
          description: run not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DetailError" }

  /api/v2/conversations/{conversationId}/runs:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema: { type: integer }
    get:
      operationId: listConversationRuns
      tags: [runs]
      summary: Runs of a conversation (newest first, owner only)
      responses:
        "200":
          description: Runs (bare array)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Run" }
        "404":
          description: conversation not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DetailError" }

  # ─────────────────────────────────────────────────────────── artifacts ──
  /api/v2/artifacts/{artifactId}/open:
    parameters:
      - name: artifactId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: openArtifact
      tags: [artifacts]
      summary: Resolve artifact URL (24h cache refresh) and 302 to the provider URL
      description: Cookie-authenticated (browser navigation). The provider
        signed URL is cached for 23h and refreshed when <25min of validity
        remain. The long-term reference is external_artifact_id, never the URL.
      responses:
        "302":
          description: Redirect to provider URL
          headers:
            Location:
              schema: { type: string }
        "404":
          description: artifact not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DetailError" }
        "502":
          description: resolution failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimpleError" }

  # ─────────────────────────────────────────────────────── conversations ──
  /api/conversations/:
    get:
      operationId: listConversations
      tags: [runs]
      summary: Conversation list for the history sidebar (newest first)
      parameters:
        - name: application_id
          in: query
          schema: { type: integer }
          description: Restrict to one application.
      responses:
        "200":
          description: Bare array (or {results} envelope is accepted by the client)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ConversationSummary" }
        "401":
          description: not authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DetailError" }

  /api/conversations/{conversationId}/:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema: { type: integer }
    get:
      operationId: getConversation
      tags: [runs]
      summary: Conversation detail with messages (history replay + deep-link resolve)
      responses:
        "200":
          description: Conversation with messages (owner only)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationDetail" }
        "404":
          description: conversation not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DetailError" }

  /api/conversations/{conversationId}/delete_conversation/:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema: { type: integer }
    delete:
      operationId: deleteConversation
      tags: [runs]
      summary: Delete a conversation and its messages/runs (owner only)
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail: { type: string }
        "404":
          description: not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DetailError" }

  /api/conversations/{conversationId}/clear/:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema: { type: integer }
    delete:
      operationId: clearConversation
      tags: [runs]
      summary: Delete the conversation's messages (keep the conversation)
      responses:
        "200":
          description: Cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail: { type: string }

  # ──────────────────────────────────────────────── conversation shares ──
  /api/v2/conversations/{conversationId}/shares:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema: { type: integer }
    post:
      operationId: createConversationShare
      tags: [runs]
      summary: Create a read-only share snapshot of selected messages (owner only)
      description: |
        Server-side snapshot: the selected message ids are persisted with a
        random unguessable token. The public read endpoint
        (GET /api/v2/public/shares/{token}) returns ONLY those messages —
        filtering never happens on the client, so a shared link cannot be
        stripped down to reveal the rest of the conversation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message_ids]
              properties:
                message_ids:
                  type: array
                  minItems: 1
                  description: Ids of the messages to include (must belong to this conversation).
                  items: { type: integer }
      responses:
        "200":
          description: Share created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationShare" }
        "400":
          description: empty list or ids outside this conversation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DetailError" }
        "404":
          description: conversation not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DetailError" }

  /api/v2/conversations/{conversationId}/shares/{shareToken}:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema: { type: integer }
      - name: shareToken
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: revokeConversationShare
      tags: [runs]
      summary: Revoke a share (owner only); public links stop resolving immediately
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail: { type: string }
        "404":
          description: conversation or share not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DetailError" }

  /api/v2/public/shares/{shareToken}:
    parameters:
      - name: shareToken
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getPublicShare
      tags: [runs]
      summary: Public read-only share payload (no authentication)
      description: Returns the conversation title and ONLY the snapshotted
        messages (with their artifact references). Revoked or unknown tokens
        resolve to 404.
      responses:
        "200":
          description: Shared messages (snapshot only)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicShareDetail" }
        "404":
          description: share not found or revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DetailError" }

  /api/v2/public/shares/{shareToken}/artifacts/{artifactId}/open:
    parameters:
      - name: shareToken
        in: path
        required: true
        schema: { type: string }
      - name: artifactId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: openPublicShareArtifact
      tags: [runs]
      summary: Resolve an artifact of a share snapshot (no authentication) and 302 to the provider URL
      description: |
        Token-scoped variant of the artifact /open resolver: the artifact must
        be referenced by one of the snapshotted messages, otherwise 404. The
        image bytes are fetched by the receiver's browser straight from the
        provider's signed URL — this service never stores or proxies them.
      responses:
        "302":
          description: Redirect to provider URL
          headers:
            Location:
              schema: { type: string }
        "404":
          description: share/artifact not found or not part of the snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DetailError" }
        "502":
          description: resolution failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimpleError" }

  # ────────────────────────────────────────────── feishu forwarding ──
  /api/v2/feishu/forward/targets:
    get:
      operationId: listFeishuForwardTargets
      tags: [runs]
      summary: Feishu forward targets (contacts or groups) for the caller
      parameters:
        - name: type
          in: query
          required: true
          schema: { type: string, enum: [user, chat] }
          description: user = org directory search, chat = the caller's groups.
        - name: query
          in: query
          schema: { type: string }
          description: Name search (user type only).
      responses:
        "200":
          description: Bare array of targets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FeishuForwardTarget" }
        "400":
          description: caller has no bound Feishu identity / bad type
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DetailError" }
        "401":
          description: not authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DetailError" }

  /api/v2/feishu/forward:
    post:
      operationId: forwardShareToFeishu
      tags: [runs]
      summary: Deliver a share snapshot card to Feishu users/groups (owner only)
      description: Sends an interactive card carrying the share link. The link
        origin comes from the request Origin header. Per-target results are
        returned; a failing user-token send falls back to the app token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [share_token, targets]
              properties:
                share_token: { type: string }
                targets:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: object
                    required: [target_type, id]
                    properties:
                      target_type: { type: string, enum: [user, chat] }
                      id: { type: string }
      responses:
        "200":
          description: Per-target delivery results
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeishuForwardResult" }
        "400":
          description: invalid body / share not owned by caller
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DetailError" }
        "401":
          description: not authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DetailError" }

  # ─────────────────────────────────────────────────────────────── auth ──
  /api/auth/register/:
    post:
      operationId: authRegister
      tags: [auth]
      summary: Local account registration (password stored Argon2id)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, password_confirm]
              properties:
                username: { type: string }
                email: { type: string }
                password: { type: string, format: password }
                password_confirm: { type: string, format: password }
      responses:
        "201":
          description: Registered (session cookie set)
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  tokens: { $ref: "#/components/schemas/Tokens" }
        "400":
          description: field errors
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FieldErrors" }

  # ───────────────────────────────────────── legacy compat shims ──
  # The local "creative agents" (Django Agent model) become Applications in
  # G12; until then these return empty collections so the marketplace and
  # editor render runtime agents without error toasts.
  /api/agents/:
    get:
      operationId: listLegacyAgents
      tags: [applications]
      summary: Local creative agents (legacy) — empty until G12
      responses:
        "200":
          description: Bare array
          content:
            application/json:
              schema:
                type: array
                items: { type: object, additionalProperties: true }

  /api/agents/categories/:
    get:
      operationId: listLegacyAgentCategories
      tags: [applications]
      summary: Local agent categories (legacy) — empty until G12
      responses:
        "200":
          description: Bare array
          content:
            application/json:
              schema:
                type: array
                items: { type: object, additionalProperties: true }

  /api/apps/skills/:
    get:
      operationId: listSkills
      tags: [applications]
      summary: Skill catalog (legacy) — empty until G12
      responses:
        "200":
          description: Bare array
          content:
            application/json:
              schema:
                type: array
                items: { type: object, additionalProperties: true }

components:
  parameters:
    ApplicationId:
      name: id
      in: path
      required: true
      schema: { type: integer }
    RunId:
      name: runId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ScheduleId:
      name: id
      in: path
      required: true
      schema: { type: integer }

  schemas:
    ConversationSummary:
      type: object
      required: [id, title, updated_at]
      properties:
        id: { type: integer }
        title: { type: string }
        application_id:
          nullable: true
          type: integer
        message_count: { type: integer }
        updated_at: { type: string, format: date-time }
        last_message:
          nullable: true
          type: object
          properties:
            role: { type: string }
            content: { type: string }
            created_at: { type: string, format: date-time }

    ConversationDetail:
      type: object
      required: [id, title, messages]
      properties:
        id: { type: integer }
        title: { type: string }
        application_id:
          nullable: true
          type: integer
        messages:
          type: array
          items:
            type: object
            required: [id, role, content, created_at]
            properties:
              id: { type: integer }
              role: { type: string, enum: [user, assistant, system] }
              content: { type: string }
              created_at: { type: string, format: date-time }
              metadata:
                nullable: true
                type: object
                additionalProperties: true

    ConversationShare:
      type: object
      required: [share_token, message_count, created_at]
      properties:
        share_token: { type: string }
        message_count: { type: integer }
        created_at: { type: string, format: date-time }

    FeishuForwardTarget:
      type: object
      required: [id, name, target_type]
      properties:
        id: { type: string }
        name: { type: string }
        avatar_url: { type: string }
        target_type: { type: string, enum: [user, chat] }

    FeishuForwardResult:
      type: object
      required: [results, success_count, fail_count]
      properties:
        results:
          type: array
          items:
            type: object
            required: [target_id, ok]
            properties:
              target_id: { type: string }
              ok: { type: boolean }
              error: { type: string }
        success_count: { type: integer }
        fail_count: { type: integer }

    PublicShareDetail:
      type: object
      required: [title, shared_at, messages]
      properties:
        title: { type: string }
        shared_at: { type: string, format: date-time }
        messages:
          type: array
          items:
            type: object
            required: [role, content, created_at]
            properties:
              role: { type: string, enum: [user, assistant, system] }
              content: { type: string }
              created_at: { type: string, format: date-time }
              artifacts:
                type: array
                description: Artifact references (metadata only) for resolving inline files.
                items:
                  type: object
                  required: [artifact_id, name]
                  properties:
                    artifact_id: { type: string }
                    name: { type: string }

    DetailError:
      type: object
      required: [detail]
      properties:
        detail: { type: string }
    SimpleError:
      type: object
      required: [error]
      properties:
        error: { type: string }
    BareError:
      type: array
      items: { type: string }
    FieldErrors:
      type: object
      description: map of field name -> list of messages
      additionalProperties:
        type: array
        items: { type: string }

    Tokens:
      type: object
      properties:
        access: { type: string }
        refresh: { type: string }

    User:
      type: object
      description: session_user_payload — the single canonical user shape
      required: [id, username]
      properties:
        id: { type: integer }
        username: { type: string }
        email: { type: string }
        role: { type: string }
        avatar: { type: string }
        avatar_url: { type: string }
        auth_source: { type: string }
        is_staff: { type: boolean }
        display_name: { type: string }
        display_id: { type: string }

    SessionUser:
      type: object
      required: [username]
      properties:
        id: { type: integer }
        username: { type: string }
        display_name: { type: string }
        display_id: { type: string }
        avatar_url: { type: string }
        auth_source: { type: string }
        is_staff: { type: boolean }

    ApplicationListItem:
      type: object
      description: shape returned by GET /api/v2/applications
      required:
        - id
        - slug
        - name
        - description
        - icon
        - avatar_url
        - color
        - kind
        - renderer_key
        - executor_key
        - category_slug
        - category_name
        - is_public
        - enabled
        - runtime_type
        - provider_key
        - external_resource_id
        - identity_mode
        - execution_mode
        - capabilities
        - is_bound
        - is_favorite
        - is_default_agent
        - can_manage
        - usage_count
        - last_used_at
        - global_usage_count
      properties:
        id: { type: integer }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        icon: { type: string }
        avatar_url: { type: string }
        color: { type: string }
        kind: { type: string, enum: [chat, task, custom] }
        renderer_key: { type: string }
        executor_key: { type: string }
        category_slug: { type: string }
        category_name: { type: string }
        is_public: { type: boolean }
        enabled: { type: boolean }
        runtime_type: { type: string }
        provider_key: { type: string }
        external_resource_id: { type: string }
        identity_mode: { type: string }
        execution_mode: { type: string }
        capabilities:
          type: object
          additionalProperties: { type: boolean }
        is_bound: { type: boolean }
        is_favorite: { type: boolean }
        is_default_agent: { type: boolean }
        can_manage: { type: boolean }
        usage_count: { type: integer }
        last_used_at:
          type: string
          nullable: true
          format: date-time
        global_usage_count: { type: integer }

    ApplicationDetail:
      type: object
      description: compact shape returned by authoring / avatar / default-agent endpoints
      required:
        - id
        - slug
        - name
        - description
        - icon
        - avatar_url
        - color
        - kind
        - is_public
        - enabled
        - category_slug
        - category_name
        - is_default_agent
        - is_bound
        - runtime_type
        - provider_key
        - external_resource_id
        - identity_mode
        - execution_mode
        - can_manage
        - updated_at
      properties:
        id: { type: integer }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        icon: { type: string }
        avatar_url: { type: string }
        color: { type: string }
        kind: { type: string, enum: [chat, task, custom] }
        is_public: { type: boolean }
        enabled: { type: boolean }
        category_slug: { type: string }
        category_name: { type: string }
        is_default_agent: { type: boolean }
        is_bound: { type: boolean }
        runtime_type: { type: string }
        provider_key: { type: string }
        external_resource_id: { type: string }
        identity_mode: { type: string }
        execution_mode: { type: string }
        can_manage: { type: boolean }
        updated_at: { type: string, format: date-time }

    RuntimeBindingInput:
      type: object
      required: [provider_key]
      properties:
        provider_key: { type: string, maxLength: 64 }
        runtime_type:
          type: string
          enum: [agent, workflow, http, local_task, media, none]
          default: agent
        external_resource_id: { type: string, maxLength: 255 }
        identity_mode: { type: string, enum: [user, tenant], default: user }
        execution_mode: { type: string, enum: [interactive, background], default: interactive }
        session_policy: { type: string, enum: [lazy, eager], default: lazy }
        artifact_policy:
          type: string
          enum: [external_refresh, mirror_on_access, mirror_on_complete]
          default: external_refresh
        timeout_seconds: { type: integer, minimum: 10, maximum: 3600, default: 300 }
        config:
          type: object
          additionalProperties: true

    ApplicationCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 100, minLength: 1 }
        slug:
          type: string
          maxLength: 100
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        description: { type: string }
        icon: { type: string, maxLength: 50 }
        color: { type: string, maxLength: 20 }
        category_slug: { type: string, maxLength: 100 }
        category_name: { type: string, maxLength: 100 }
        is_public: { type: boolean, default: true }
        kind: { type: string, enum: [chat], default: chat }
        renderer_key: { type: string, default: chat }
        runtime: { $ref: "#/components/schemas/RuntimeBindingInput" }
        set_default_agent: { type: boolean, default: false }

    ApplicationUpdateRequest:
      type: object
      properties:
        name: { type: string, maxLength: 100 }
        description: { type: string }
        icon: { type: string }
        color: { type: string }
        is_public: { type: boolean }
        enabled: { type: boolean }
        category_slug: { type: string }
        category_name: { type: string }
        runtime: { $ref: "#/components/schemas/RuntimeBindingInput" }
        set_default_agent: { type: boolean }

    FavoriteResult:
      type: object
      required: [application_id, is_favorite]
      properties:
        application_id: { type: integer }
        is_favorite: { type: boolean }

    RuntimeDescriptor:
      type: object
      required:
        - key
        - provider_key
        - provider_name
        - runtime_type
        - label
        - resource_id_label
        - resource_id_hint
        - resource_id_pattern
        - resource_id_required
        - identity_modes
        - execution_modes
        - capabilities
      properties:
        key: { type: string, description: "provider_key:runtime_type" }
        provider_key: { type: string }
        provider_name: { type: string }
        runtime_type: { type: string }
        label: { type: string }
        resource_id_label: { type: string }
        resource_id_hint: { type: string }
        resource_id_pattern: { type: string }
        resource_id_required: { type: boolean }
        identity_modes:
          type: array
          items: { type: string }
        execution_modes:
          type: array
          items: { type: string }
        capabilities:
          type: object
          additionalProperties: { type: boolean }

    RuntimeValidationResult:
      type: object
      required: [ok, checked, detail]
      properties:
        ok: { type: boolean }
        checked: { type: boolean }
        detail: { type: string }

    CreateRunRequest:
      type: object
      required: [application_id, content]
      properties:
        application_id: { type: integer }
        content: { type: string, description: plain text user message }
        conversation_id: { type: integer }
        attachment_ids:
          type: array
          items: { type: string, format: uuid }
          description: studio attachment ids uploaded by this user, unbound to a run
        client_request_id:
          type: string
          maxLength: 64
          description: >-
            Client-generated idempotency token for ONE user send action (e.g.
            a UUID). It must be stable across transport retries of that action
            and must change when the user edits the message and sends again.
            Reusing it with a different payload is a 409.

    Run:
      type: object
      required:
        - id
        - organization
        - user
        - application
        - conversation
        - runtime_binding
        - provider
        - runtime_type
        - external_run_id
        - status
        - provider_status
        - provider_finish_reason
        - input
        - output
        - attempt
        - max_attempts
        - queued_at
        - started_at
        - finished_at
        - error_code
        - error_message
        - created_at
        - updated_at
      properties:
        id: { type: string, format: uuid }
        organization:
          type: integer
          nullable: true
        user:
          type: integer
          nullable: true
        application: { type: integer }
        conversation: { type: integer }
        runtime_binding: { type: integer }
        provider: { type: string }
        runtime_type: { type: string }
        external_run_id: { type: string, description: Aily agent_chat_id }
        status:
          type: string
          enum: [queued, running, waiting_input, waiting_external, cancelling, cancelled, succeeded, failed, interrupted]
        provider_status: { type: string }
        provider_finish_reason: { type: string }
        input:
          type: object
          additionalProperties: true
        output:
          type: object
          additionalProperties: true
        attempt: { type: integer }
        max_attempts: { type: integer }
        queued_at: { type: string, format: date-time }
        started_at:
          type: string
          nullable: true
          format: date-time
        finished_at:
          type: string
          nullable: true
          format: date-time
        error_code: { type: string }
        error_message: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    RunEvent:
      type: object
      # `run_id` (not `run`): this is the SAME record the SSE stream emits,
      # so one reducer can consume both without a rename (第九轮复审 P2).
      required: [id, run_id, sequence, event_type, payload, created_at]
      properties:
        id: { type: integer }
        run_id: { type: string, format: uuid }
        sequence: { type: integer }
        event_type:
          type: string
          enum:
            - run.started
            - content.started
            - content.delta
            - content.completed
            - content.snapshot
            - tool.started
            - tool.completed
            - artifact.discovered
            - artifact.created
            - input.required
            - run.completed
            - run.failed
            # Legacy historical compatibility only (pre-closure replays);
            # the live protocol terminates with run.completed/failed/cancelled.
            - run.interrupted
            - run.cancelled
            - run.poll
            - run.retrying
            - run.waiting_external
        payload:
          type: object
          additionalProperties: true
        created_at: { type: string, format: date-time }

    RunEventPage:
      type: object
      required: [items, next_after, has_more]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/RunEvent" }
        next_after:
          type: integer
          description: Highest sequence in this page; feed back as `after` to continue.
        has_more:
          type: boolean
          description: >-
            True when the page was full, so more events may follow. Derived
            from the page size rather than a COUNT, so reading a page never
            costs the whole history.

    RunCommand:
      type: object
      required: [id, run, command_type, payload, status, created_by, created_at, resolved_at]
      properties:
        id: { type: string, format: uuid }
        run: { type: string, format: uuid }
        command_type: { type: string, enum: [cancel, respond, resume] }
        payload:
          type: object
          additionalProperties: true
        status: { type: string, enum: [pending, accepted, rejected] }
        created_by:
          type: integer
          nullable: true
        created_at: { type: string, format: date-time }
        resolved_at:
          type: string
          nullable: true
          format: date-time

    CreateRunCommandRequest:
      type: object
      required: [command_type]
      properties:
        command_type: { type: string, enum: [cancel, respond, resume] }
        payload:
          type: object
          additionalProperties: true

    RuntimeAttachment:
      type: object
      required: [id, run, conversation, provider, external_attachment_id, attachment_type, name, source_type, status, created_at]
      properties:
        id: { type: string, format: uuid }
        run:
          type: string
          nullable: true
          format: uuid
        conversation:
          type: integer
          nullable: true
        provider: { type: string }
        external_attachment_id: { type: string, description: Aily agent_attachment_id }
        attachment_type: { type: string, enum: [image, file, feishu_doc, bitable] }
        name: { type: string }
        source_type: { type: string, enum: [upload, doc_url] }
        status: { type: string, enum: [pending, uploaded, failed] }
        created_at: { type: string, format: date-time }

    RunArtifact:
      type: object
      required:
        - id
        - run
        - provider
        - external_artifact_id
        - provider_artifact_type
        - name
        - normalized_type
        - storage_type
        - cached_url_expires_at
        - resolution_status
        - created_at
        - updated_at
      properties:
        id: { type: string, format: uuid }
        run: { type: string, format: uuid }
        provider: { type: string }
        external_artifact_id: { type: string, description: Aily agent_artifact_id — the long-term reference }
        provider_artifact_type: { type: string }
        name: { type: string }
        normalized_type: { type: string, default: file }
        storage_type: { type: string, enum: [external, mirrored] }
        cached_url_expires_at:
          type: string
          nullable: true
          format: date-time
        resolution_status: { type: string, enum: [pending, resolved, expired, failed, mirrored] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    # ─────────────────────────────────────────────────────── schedules ──
    ScheduleUpsertRequest:
      type: object
      description: Structured trigger only — the UI never submits raw cron.
      required:
        - name
        - application_id
        - prompt
        - schedule_type
      properties:
        name: { type: string, maxLength: 200 }
        description: { type: string }
        application_id: { type: integer }
        prompt: { type: string, description: User message sent on every run }
        schedule_type: { type: string, enum: [once, daily, weekly, monthly] }
        timezone: { type: string, default: Asia/Shanghai, description: IANA name }
        run_at: { type: string, format: date-time, description: Required for schedule_type=once }
        trigger:
          type: object
          properties:
            time: { type: string, description: "HH:MM in the schedule timezone" }
            days_of_week:
              type: array
              items: { type: integer, minimum: 0, maximum: 6 }
              description: 0=Sunday … 6=Saturday (weekly)
            day_of_month: { type: integer, minimum: 1, maximum: 31, description: Short months clamp to the last day (monthly) }
        conversation_policy: { type: string, enum: [new_each_run, reuse], default: new_each_run }
        overlap_policy: { type: string, enum: [skip, queue], default: queue }
        misfire_policy: { type: string, enum: [fire_once, skip], default: fire_once }
        deadline_policy: { type: string, enum: [skip, execute_anyway], default: execute_anyway }
        execution_window_seconds: { type: integer, default: 0, maximum: 86400 }
        deliveries:
          type: array
          maxItems: 20
          description: Feishu targets; omitted/empty means no delivery
          items:
            type: object
            required: [target_type, target_id]
            properties:
              target_type: { type: string, enum: [user, chat] }
              target_id: { type: string }
              target_name: { type: string, description: Display snapshot captured at save time }
              content_mode: { type: string, enum: [summary], default: summary }

    Schedule:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string }
        application_id: { type: integer }
        prompt: { type: string }
        schedule_type: { type: string, enum: [once, daily, weekly, monthly] }
        cron_expression: { type: string, description: Informational — derived from the trigger }
        timezone: { type: string }
        run_at: { type: string, format: date-time, nullable: true }
        trigger:
          type: object
          properties:
            time: { type: string }
            days_of_week: { type: array, items: { type: integer } }
            day_of_month: { type: integer }
        enabled: { type: boolean }
        conversation_policy: { type: string }
        overlap_policy: { type: string }
        misfire_policy: { type: string }
        deadline_policy: { type: string }
        execution_window_seconds: { type: integer }
        next_run_at: { type: string, format: date-time, nullable: true }
        last_run_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        last_occurrence: { $ref: "#/components/schemas/ScheduleOccurrence" }

    ScheduleOccurrence:
      type: object
      description: One scheduled time slot of a schedule and its run linkage.
      properties:
        id: { type: integer }
        schedule_id: { type: integer }
        scheduled_at: { type: string, format: date-time }
        enqueued_at: { type: string, format: date-time, nullable: true }
        admitted_at: { type: string, format: date-time, nullable: true }
        run_id: { type: string, format: uuid, description: Empty when the occurrence never reached a run }
        status: { type: string, enum: [pending, queued, running, succeeded, failed, skipped] }
        triggered_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
