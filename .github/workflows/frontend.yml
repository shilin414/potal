name: frontend

on:
  push:
    branches: [dev, main]
    paths: ['frontend/**', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['frontend/**', '.github/workflows/frontend.yml']

defaults:
  run:
    working-directory: frontend

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: typecheck
        run: npx tsc --noEmit

      # The review gate requires lint, and `--max-warnings 0` is part of the
      # repo's own script. Keeping lint only in the local developer path let
      # unused imports and a conditional hook accumulate unnoticed.
      - name: lint
        run: npm run lint

      - name: unit tests
        run: npx vitest run

      - name: production build
        run: npx vite build
