name: backend

on:
  push:
    branches: [dev, main]
    paths: ['backend-go/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend-go/**', '.github/workflows/backend.yml']

defaults:
  run:
    working-directory: backend-go

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum

      # Workflow lint gate: duplicate YAML keys and invalid workflow
      # structures fail here BEFORE wasting the integration jobs.
      # Pinned: actionlint publishes no floating major tag (there is no
      # `v1`), so `@v1` fails at "Set up job".
      - name: actionlint
        uses: rhysd/actionlint@v1.7.12

      - name: gofmt check
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test (unit; integration gated by env)
        run: go test ./... -count=1

  # Integration gate: real TiDB + Redis via Docker (修复计划 §78).
  # STUDIO_TEST_TIDB / STUDIO_TEST_REDIS opt the integration suite in.
  #
  # NOTE: the TiDB service container deliberately has NO health-cmd —
  # `pingcap/tidb` may not ship curl/mysqladmin, and the check runs inside
  # the container, not on the runner. Readiness is done host-side below.
  integration:
    runs-on: ubuntu-latest
    env:
      DEBIAN_FRONTEND: noninteractive
      STUDIO_TEST_TIDB: '1'
      STUDIO_TEST_REDIS: '1'
      DB_HOST: 127.0.0.1
      DB_PORT: 4000
      DB_NAME: xiaoan3_go
      DB_USER: root
      DB_PASSWORD: ''
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_DB: '2'
    services:
      tidb:
        image: pingcap/tidb:v8.0.0
        ports: ['4000:4000']
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum
      - name: Install database clients
        run: sudo apt-get update && sudo apt-get install -y mysql-client curl
      - name: wait for tidb (host-side readiness)
        run: |
          for (( attempt = 0; attempt < 90; attempt++ )); do
            if mysql -h 127.0.0.1 -P 4000 -u root -e "SELECT 1" >/dev/null 2>&1; then break; fi
            sleep 2
          done
          echo "::error title=tidb not ready::readiness timed out after 180s"
          mysql -h 127.0.0.1 -P 4000 -u root -e "CREATE DATABASE IF NOT EXISTS xiaoan3_go"
      # studio-migrate applies migrations and EXITS. `cmd/api -migrate`
      # would continue into app.Build + the HTTP server: without the
      # runtime secrets (TOKEN_ENCRYPTION_KEY is unset in CI) the build
      # fails, and with them it would block on the server.
      #
      # The failure path emits a ::error annotation carrying pwd + the
      # migrated tool's own message, so a red run is diagnosable from the
      # checks API without downloading logs.
      - name: apply migrations
        run: |
          set -uo pipefail
          echo "pwd=$(pwd)"
          if ! out=$(go run ./cmd/migrate 2>&1); then
            printf '%s\n' "$out"
            msg=$(printf '%s' "$out" | tr '\n' ' ' | tr -s ' ' | tail -c 500)
            echo "::error title=migrate failed::pwd=$(pwd) :: $msg"
            exit 1
          fi
          printf '%s\n' "$out"
      - name: integration tests
        run: |
          set -uo pipefail
          if ! out=$(go test ./tests/integration/... -count=1 -v 2>&1); then
            printf '%s\n' "$out"
            msg=$(printf '%s' "$out" | grep -E '^(--- FAIL|FAIL|panic:|\s+.*_test\.go:)' | tr '\n' ' ' | tr -s ' ' | tail -c 900)
            echo "::error title=integration tests failed::$msg"
            exit 1
          fi
          printf '%s\n' "$out" | tail -40

  # Primary compatibility floor required by the architecture document.
  mysql57:
    runs-on: ubuntu-latest
    env:
      DEBIAN_FRONTEND: noninteractive
      STUDIO_TEST_TIDB: '1'
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: xiaoan3_go
      DB_USER: root
      DB_PASSWORD: ''
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: xiaoan3_go
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1"
          --health-interval 10s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum
      - name: Install database clients
        run: sudo apt-get update && sudo apt-get install -y mysql-client curl
      - name: wait for mysql 5.7
        run: |
          for (( attempt = 0; attempt < 60; attempt++ )); do
            if mysql -h 127.0.0.1 -P 3306 -u root -e "SELECT 1" >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          echo "::error title=mysql 5.7 not ready::readiness timed out after 120s"
          mysql -h 127.0.0.1 -P 3306 -u root -e "SELECT 1"
      - name: apply migrations
        run: |
          set -uo pipefail
          echo "pwd=$(pwd)"
          if ! out=$(go run ./cmd/migrate 2>&1); then
            printf '%s\n' "$out"
            msg=$(printf '%s' "$out" | tr '\n' ' ' | tr -s ' ' | tail -c 500)
            echo "::error title=migrate failed (mysql57)::pwd=$(pwd) :: $msg"
            exit 1
          fi
          printf '%s\n' "$out"
      - name: integration tests
        run: |
          set -uo pipefail
          if ! out=$(go test ./tests/integration/... -count=1 -v 2>&1); then
            printf '%s\n' "$out"
            msg=$(printf '%s' "$out" | grep -E '^(--- FAIL|FAIL|panic:|\s+.*_test\.go:)' | tr '\n' ' ' | tr -s ' ' | tail -c 900)
            echo "::error title=integration tests failed (mysql57)::$msg"
            exit 1
          fi
          printf '%s\n' "$out" | tail -40
